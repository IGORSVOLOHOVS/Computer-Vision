[project]
name = "Computer-Vision"
version = "1.0.0"
description = "A computer vision project for mushroom classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "timm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",    # the CI runs pytest --cov; without this the run aborts
    "pytest-mock",   # the suite uses the `mocker` fixture
    "ruff",
    "mypy",
    "pytest-benchmark",   # benchmarks/ needs the `benchmark` fixture
]
release = ["pyinstaller>=6.0"]

[tool.ruff]
# Vendored tooling and generated output, not this project's code.
extend-exclude = [".agent"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["clean_venv"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "timm.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.per-file-ignores]
# The helper scripts drive git and build tools through subprocess on
# purpose; the bandit checks flag that by design.
"scripts/*" = ["S404", "S603", "S607", "S310", "PLR0912", "C901", "ANN", "D"]
